spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# SERVER
# ===============================
# Render inject PORT; local dev dung SERVER_PORT hoac 9090
server.port=${PORT:${SERVER_PORT:9090}}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===============================
# DATASOURCE - MYSQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pet_care?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# Khong de Hibernate tu ALTER TABLE khi khoi dong, tranh treo app do MySQL metadata lock.
# Khi can tu dong update schema tam thoi, co the set JPA_DDL_AUTO=update trong .env.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:petcare-backend-development-secret-key-change-this-before-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}
app.password-reset.otp-expiration-minutes=${PASSWORD_RESET_OTP_EXPIRATION_MINUTES:10}
app.vaccine.seed-enabled=${VACCINE_SEED_ENABLED:true}
app.reminder.batch-size=${REMINDER_BATCH_SIZE:100}
app.reminder.scheduler-enabled=${REMINDER_SCHEDULER_ENABLED:true}
app.reminder.custom-worker-delay-ms=${REMINDER_CUSTOM_WORKER_DELAY_MS:60000}
app.reminder.vaccine-worker-delay-ms=${REMINDER_VACCINE_WORKER_DELAY_MS:60000}
app.reminder.vaccine-notification-time=${REMINDER_VACCINE_NOTIFICATION_TIME:09:00}

app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
app.firebase.service-account-json-base64=${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}

app.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
app.ndamaps.api-key=${NDA_MAP_API_KEY:}
app.ndamaps.base-url=${NDA_MAP_BASE_URL:https://mapapis.ndamaps.vn/v1}
app.ndamaps.clinic-category=${NDA_MAP_CLINIC_CATEGORY:veterinary_care}
app.ndamaps.max-radius-km=${NDA_MAP_MAX_RADIUS_KM:5}
app.ndamaps.max-results=${NDA_MAP_MAX_RESULTS:10}
app.ndamaps.detail-enrichment-limit=${NDA_MAP_DETAIL_ENRICHMENT_LIMIT:5}

gemini.api.key=${GEMINI_API_KEY:AQ.Ab8RN6KJ4pClO4Wifl1vlJJomuEzZ-TVedVSfSBgRtMfXawKBg}

app.mail.provider=${MAIL_PROVIDER:resend}
app.mail.sender-email=${MAIL_SENDER_EMAIL:}
app.mail.dev-expose-otp=${MAIL_DEV_EXPOSE_OTP:true}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.resend.from-email=${RESEND_FROM_EMAIL:PetCare <onboarding@resend.dev>}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:40MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:200MB}
app.upload.max-file-size-mb=${APP_UPLOAD_MAX_FILE_SIZE_MB:40}
app.upload.root-dir=${APP_UPLOAD_ROOT_DIR:uploads}
app.upload.public-url-prefix=${APP_UPLOAD_PUBLIC_URL_PREFIX:http://localhost:9090/uploads}
app.upload.blog-cover-dir=${APP_UPLOAD_BLOG_COVER_DIR:blog-cover}

# ===============================================
# CẤU HÌNH LƯU TRỮ ẢNH TRÊN CLOUD (CLOUDINARY)
# ===============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Chọn chế độ lưu trữ: 'cloudinary' (lên cloud) hoặc 'local' (lưu ổ cứng máy)
storage.provider=${STORAGE_PROVIDER:cloudinary}
